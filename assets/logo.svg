<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 270" width="600" height="540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
      .arch-soft { fill: none; stroke: #8E2137; stroke-width: 15; stroke-linecap: round; opacity: .16; }
      .arch-line { fill: none; stroke: #8E2137; stroke-width: 3.4; stroke-linecap: round; }
      .arch-acc { fill: none; stroke: #C9A24A; stroke-width: 2; stroke-linecap: round; opacity: .85; }
      .moon { fill: none; stroke: #C9A24A; stroke-width: 4.6; stroke-linecap: round; }
      .star { fill: #C9A24A; }
      .drop { fill: #8E2137; }
      .wordmark { font-family: 'Great Vibes', cursive; font-size: 46px; fill: #8E2137; }
    </style>
  </defs>

  <!-- Каліграфічний знак «тиха кімната»: мазок-арка, крапля туші, півмісяць, зірка, золотий світ на порозі -->
  <path class="arch-soft" d="M 40 190 A 110 110 0 0 1 260 190"/>
  <path class="arch-line" d="M 40 190 A 110 110 0 0 1 260 190"/>
  <path class="arch-acc" d="M 52 190 A 98 98 0 0 1 248 190" opacity=".5"/>
  <path class="drop" d="M 40 190 C 29 206 49 224 63 209 C 74 198 62 187 40 190 Z"/>
  <path class="moon" d="M 122 116 A 26 26 0 1 0 122 162 A 19 19 0 1 1 122 116 Z"/>
  <path class="star" d="M 160 112 L 162.6 119.4 L 170 122 L 162.6 124.6 L 160 132 L 157.4 124.6 L 150 122 L 157.4 119.4 Z"/>
  <circle class="star" cx="150" cy="190" r="6.5"/>

  <!-- Каліграфічна слово-марка -->
  <text class="wordmark" x="150" y="252" text-anchor="middle">The Quiet Room</text>
</svg>