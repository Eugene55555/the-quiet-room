<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Товар — The Quiet Room</title>
<meta name="description" content="Принти The Quiet Room: футболки, худі та кухлі з фірмовими знаками тихої кімнати.">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="promo" data-i18n="promo"></div>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html" aria-label="The Quiet Room — на головну">
      <svg viewBox="0 0 200 240" class="brand-mark" aria-hidden="true">
        <path class="arch" d="M 40 195 A 60 60 0 0 1 160 195"/>
        <path class="moon" d="M 100 84 A 32 32 0 1 0 100 148 A 24 24 0 1 1 100 84 Z"/>
        <path class="star" d="M 130 88 L 133.5 96 L 142 99.5 L 133.5 103 L 130 111 L 126.5 103 L 118 99.5 L 126.5 96 Z"/>
        <circle class="light" cx="100" cy="195" r="5.5"/>
      </svg>
      <span class="wordmark">The <em>Quiet</em> Room</span>
    </a>

    <form class="search" id="search-form" role="search">
      <input type="search" data-i18n-ph="search_ph" aria-label="Пошук дизайну">
      <button type="submit" aria-label="Шукати">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </form>

    <div class="header-tools">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="uk">UA</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="cart-btn" id="cart-btn">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-label" data-i18n="cart"></span>
        <span class="cart-count">0</span>
      </button>
    </div>

    <button class="burger" id="burger" aria-label="Відкрити меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav class="site-nav-mobile" id="site-nav-mobile" aria-label="Мобільне меню">
    <a href="collection.html" data-i18n="nav_collection"></a>
    <a href="about.html" data-i18n="nav_about"></a>
    <a href="contact.html" data-i18n="nav_contact"></a>
    <div class="lang-row">
      <button class="lang-btn" data-lang="uk">UA</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </nav>
</header>

<nav class="nav-strip" aria-label="Основна навігація">
  <div class="container">
    <a href="collection.html" class="active" data-i18n="nav_collection"></a>
    <a href="about.html" data-i18n="nav_about"></a>
    <a href="contact.html" data-i18n="nav_contact"></a>
  </div>
</nav>

<main>
  <div class="container">

    <p class="crumbs">
      <a href="index.html" data-i18n="crumb_home"></a> /
      <a href="collection.html" data-i18n="crumb_collection"></a> /
      <span id="crumb-name">Півмісяць</span>
    </p>

    <div class="product-inner">
      <div class="product-media" id="product-media">
        <img id="product-img" src="assets/img/tee-cream.svg" alt="Кремова футболка з принтом-півмісяцем" width="400" height="500">
      </div>

      <div class="product-info">
        <p class="product-tag" id="product-tag">Футболка · Бавовна</p>
        <h1 id="product-name">Півмісяць</h1>
        <p class="by-line" data-i18n="card_by"></p>
        <p class="price">от <span id="product-price">€24,90</span></p>
        <p class="price-note">Орієнтир — фінальну ціну затвердимо з постачальником друку.</p>
        <p class="product-desc" id="product-desc"></p>

        <p class="label" id="size-label" data-i18n="size_label"></p>
        <div class="size-row" id="size-row">
          <span class="size">S</span><span class="size">M</span><span class="size">L</span>
          <span class="size">XL</span><span class="size dim">XXL</span>
        </div>
        <p class="size-xxl-note" id="xxl-note" data-i18n="size_xxl"></p>

        <div class="qty-row">
          <span class="label" style="margin:0" data-i18n="qty"></span>
          <div class="qty-stepper">
            <button type="button" id="qty-minus" aria-label="−">−</button>
            <input type="text" id="qty" value="1" inputmode="numeric" aria-label="Кількість">
            <button type="button" id="qty-plus" aria-label="+">+</button>
          </div>
        </div>

        <button class="btn btn-black" id="add-cart" data-i18n="add_to_cart"></button>

        <div class="specs">
          <details open>
            <summary data-i18n="details"></summary>
            <div class="spec-body" data-i18n="printing_txt"></div>
          </details>
          <details>
            <summary data-i18n="material"></summary>
            <div class="spec-body" data-i18n="material_txt"></div>
          </details>
          <details>
            <summary data-i18n="care"></summary>
            <div class="spec-body" data-i18n="care_txt"></div>
          </details>
          <details>
            <summary data-i18n="delivery"></summary>
            <div class="spec-body" data-i18n="delivery_txt"></div>
          </details>
        </div>
      </div>
    </div>

    <div class="section" style="padding-bottom:0">
      <div class="sec-head">
        <h2 class="sec-title" data-i18n="related"></h2>
      </div>
      <div class="grid">
        <a class="card" href="product.html?p=arch" data-name="Арка Arch" data-tag="Футболка T-Shirt" data-cat="clothes" data-price="24.90">
          <div class="card-media">
            <img src="assets/img/tee-white.svg" alt="Біла футболка з принтом-аркою" width="400" height="500">
            <span class="badge" data-i18n="card_soon"></span>
          </div>
          <div class="card-body">
            <p class="card-tag" data-i18n="p_arch_tag"></p>
            <h3 class="card-title" data-i18n="p_arch_name"></h3>
            <p class="card-by" data-i18n="card_by"></p>
            <p class="card-price"><span class="from" data-i18n="card_from"></span> €24,90</p>
          </div>
        </a>
        <a class="card" href="product.html?p=night" data-name="Нічник Nightlight" data-tag="Худі Hoodie" data-cat="clothes" data-price="39.90">
          <div class="card-media dark">
            <img src="assets/img/hoodie-dark.svg" alt="Темне худі з принтом «тиха кімната»" width="400" height="500">
            <span class="badge" data-i18n="card_soon"></span>
          </div>
          <div class="card-body">
            <p class="card-tag" data-i18n="p_night_tag"></p>
            <h3 class="card-title" data-i18n="p_night_name"></h3>
            <p class="card-by" data-i18n="card_by"></p>
            <p class="card-price"><span class="from" data-i18n="card_from"></span> €39,90</p>
          </div>
        </a>
        <a class="card" href="product.html?p=mug" data-name="Місяць Moon" data-tag="Кухоль Mug" data-cat="home" data-price="16.90">
          <div class="card-media">
            <img src="assets/img/mug.svg" alt="Кухоль з принтом-півмісяцем" width="400" height="500">
            <span class="badge" data-i18n="card_soon"></span>
          </div>
          <div class="card-body">
            <p class="card-tag" data-i18n="p_mug_tag"></p>
            <h3 class="card-title" data-i18n="p_mug_name"></h3>
            <p class="card-by" data-i18n="card_by"></p>
            <p class="card-price"><span class="from" data-i18n="card_from"></span> €16,90</p>
          </div>
        </a>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <div class="footer-brand">
        <svg viewBox="0 0 200 240" aria-hidden="true">
          <path class="arch" d="M 40 195 A 60 60 0 0 1 160 195"/>
          <path class="moon" d="M 100 84 A 32 32 0 1 0 100 148 A 24 24 0 1 1 100 84 Z"/>
          <path class="star" d="M 130 88 L 133.5 96 L 142 99.5 L 133.5 103 L 130 111 L 126.5 103 L 118 99.5 L 126.5 96 Z"/>
          <circle class="light" cx="100" cy="195" r="5.5"/>
        </svg>
        <span>The <em>Quiet</em> Room</span>
      </div>
      <p class="footer-tag" data-i18n="f_tag"></p>
    </div>
    <div class="footer-col">
      <h4 data-i18n="footer_shop"></h4>
      <a href="collection.html" data-i18n="f_col"></a>
      <a href="contact.html" data-i18n="f_ship"></a>
    </div>
    <div class="footer-col">
      <h4 data-i18n="footer_about"></h4>
      <a href="about.html" data-i18n="f_about"></a>
      <a href="contact.html" data-i18n="f_contact"></a>
    </div>
    <div class="footer-col">
      <h4 data-i18n="footer_support"></h4>
      <a href="contact.html" data-i18n="f_returns"></a>
    </div>
  </div>
  <div class="container footer-bottom">
    <span data-i18n="f_rights"></span>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="uk">UA</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/main.js"></script>
</body>
</html>
